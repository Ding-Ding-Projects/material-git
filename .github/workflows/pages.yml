name: Public documentation
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'src/site-shared/**'
      - 'src/shared/**'
      - 'src/renderer/localization.ts'
      - 'assets/icon.*'
      - 'scripts/build-site.mjs'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
      - name: Build reviewed public documentation
        run: node scripts/build-site.mjs --require-reviewed-current
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4
